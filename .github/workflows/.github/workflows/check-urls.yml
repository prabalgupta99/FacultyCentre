name: Check URLs (Faculty Plus test set)
on:
  push:
    branches: [jev-detector]
    paths: ['check-urls.txt']
concurrency:
  group: check-urls
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Check each URL (dry, no writes)
        env:
          TYPESAFE_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY || secrets.TYPESAFE_API_KEY }}
          JEV_ENDPOINT: ${{ secrets.AI_GATEWAY_API_KEY && 'https://ai-gateway.vercel.sh/typesafe/v1/systemone' || '' }}
          JEV_MODELS: ${{ secrets.AI_GATEWAY_API_KEY && 'convaiinnovations/laya-free' || '' }}
        run: npx tsx scripts/check-url.ts --file check-urls.txt | tee check.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: check-log, path: check.log }
